<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Observer</title>
<link rel="stylesheet" href="/ui/app.css" />
</head>
<body>
  <header>
    <h1>● OBSERVER</h1>
    <span id="conn">connecting…</span>
    <span id="counts"></span>
    <button id="newBtn" class="ghost">New chat</button>
    <button id="topoBtn" class="ghost">Topology</button>
    <button id="statsBtn" class="ghost">Stats</button>
    <button id="histBtn" class="ghost">History</button>
  </header>
  <div id="history"></div>
  <div id="stats"></div>
  <div id="topology"></div>
  <main>
    <aside id="sidebar"></aside>
    <div id="splitter" title="drag to resize"></div>
    <section>
      <div id="modelbar"></div>
      <div id="output"></div>
      <div class="composer">
        <select id="model"></select>
        <input id="prompt" placeholder="Type a prompt and press Enter…" />
        <button id="send">Send</button>
      </div>
      <div class="alerts-head">Alerts</div>
      <div id="alerts"></div>
    </section>
  </main>
<script src="/ui/app.js"></script>
</body>
</html>
